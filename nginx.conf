## Balanceador de carga de este servicio (Escenario 4 — Disponibilidad).
## Reparte round-robin entre sus 2 réplicas (api-gateway-1/api-gateway-2,
## definidas en docker-compose.yml). Salud PASIVA (Nginx libre, sin plan
## Plus): max_fails=1 fail_timeout=10s saca una réplica fallida de rotación
## por 10s, que es la medida de respuesta pedida en el escenario.
events {}

http {
  upstream backend {
    server api-gateway-1:8080 max_fails=1 fail_timeout=10s;
    server api-gateway-2:8080 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_next_upstream error timeout http_502 http_503 http_504;

      # Qué réplica atendió esta petición — así se demuestra el balanceo
      # (curl en loop, o el k6 de esc04-disponibilidad.js) sin tocar código
      # de ningún servicio.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
