name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: SonarCloud lo usa para detectar el código nuevo y el blame
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # El gateway aún no tiene pruebas: --if-present hace que el paso pase sin script "test".
      # Cuando exista (Jest con coverageReporters lcov), debe dejar coverage/lcov.info.
      - name: Pruebas con cobertura
        run: npm run test --if-present -- --ci --coverage

      # ESC-05: el análisis solo corre si existe el secreto SONAR_TOKEN, para no
      # bloquear PRs mientras se crea la organización en SonarCloud (ni los de Dependabot,
      # que no reciben secretos de Actions).
      - name: ¿Está configurado SonarCloud?
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud::Falta el secreto SONAR_TOKEN; se omite el análisis estático."
          fi

      - name: Análisis estático (SonarCloud)
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - run: npm run build
      - run: docker build -t planazo-api-gateway:ci .
