# Escenario 4 (Disponibilidad): este servicio corre con 2 réplicas + su
# propio balanceador Nginx — autosuficiente, sin depender de planazo-infra
# para escalar. Requiere que `planazo-infra` ya esté arriba (crea la red
# compartida `planazo-net` y las bases de datos/Redis que booking, promo y
# game usan); este repo solo se conecta a ella, no la crea.
#
#   docker compose up --build -d     → 2 réplicas + lb, igual que siempre en :8080
#
# Ver ../planazo-infra/ESCENARIO-04-DISPONIBILIDAD.md para el detalle del
# escenario de calidad y cómo demostrarlo.

networks:
  default:
    name: planazo-net
    external: true

x-app-common: &app-common
  build:
    context: .
  restart: unless-stopped
  env_file: ../planazo-infra/.env
  environment:
    PORT: "8080"
    BOOKING_URL: http://booking:3001
    PROMO_URL: http://promo:3002
    GAME_URL: http://game:8082
    # JWT_SECRET, GATEWAY_KEY, ALLOWED_ORIGINS y ANTHROPIC_API_KEY vienen de env_file.
  healthcheck:
    # OJO: a diferencia de booking/promo/realtime, api-gateway tiene un
    # prefijo global `/api` (`app.setGlobalPrefix('api')` en main.ts), así
    # que su salud vive en /api/health, no en /health (el propio Dockerfile
    # de este repo ya lo hace bien; el docker-compose.yml de planazo-infra,
    # antes de este cambio, no lo necesitaba porque nada dependía de este
    # healthcheck — ahora sí, lo depende `lb`).
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 15s

services:
  api-gateway-1:
    <<: *app-common
    container_name: planazo-api-gateway-1

  api-gateway-2:
    <<: *app-common
    container_name: planazo-api-gateway-2

  lb:
    image: nginx:1.27-alpine
    container_name: planazo-api-gateway-lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api-gateway-1:
        condition: service_healthy
      api-gateway-2:
        condition: service_healthy
