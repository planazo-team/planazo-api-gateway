# Escenario 5 (Mantenibilidad): análisis estático con SonarCloud.
# sonar.organization / sonar.projectKey / sonar.host.url se pasan como
# -D desde .github/workflows/ci.yml (secrets); aquí solo lo que es propio
# de este repo. Sin sonar.javascript.lcov.reportPaths: este repo todavía
# no tiene pruebas, así que no hay cobertura que reportar.
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**
